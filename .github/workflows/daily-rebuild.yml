name: Daily Rebuild - Living Landing Page

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 06:00 UTC
  workflow_dispatch:      # Manual trigger
  push:
    paths:  # sources only: triggering on the generated index.html made pushes race the bot's own run
      - 'site-source/**'
      - 'tsugi-legal-build/**'
      - '.github/workflows/daily-rebuild.yml'

permissions:
  contents: write  # Needed to commit/push the regenerated pages

concurrency:  # never two rebuilds at once
  group: daily-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tsugi-legal-build/package.json
      
      - name: Install dependencies
        run: |
          cd tsugi-legal-build
          npm ci
      
      # Pages are regenerated from site-source/ every run (never patched in place), so nothing from a
      # previous run can pile up. On a rejected push the run starts over from the latest master instead
      # of merging two generated HTML files hunk by hunk (that once duplicated cards and dropped links).
      - name: Build and publish
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            (cd site-source && node gen.js) && (cd tsugi-legal-build && node build.js) && (cd site-source && node pages.js)
            # -A: pages of announcements that left the lists are deleted, not just left behind.
            git add -A -- index.html categorie.html fiche.html data assets en nl anime manga manhwa manhua webtoon series dramas films jeux
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -m "🤖 Daily rebuild: $(date -u +'%Y-%m-%d') - Updated upcoming releases"
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt), rebuilding on top of the latest master"
            git fetch origin master && git reset --hard origin/master
          done
          exit 1
